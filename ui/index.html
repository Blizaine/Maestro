<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/maestro.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Hint the UA before CSS loads so native controls don't flash the
         wrong scheme; the effective scheme comes from index.css
         (:root dark, [data-theme="ivory"] light). theme-color tints
         mobile browser chrome and is synced per theme by the inline
         script below and by applyTheme() on switch. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Maestro</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply theme BEFORE React mounts to avoid a flash of the wrong
      // theme on load. Resolves the two-dimensional preference
      // (mode: dark/light/auto + one theme per variant) exactly like
      // src/lib/theme.ts, including migrating the legacy single-theme
      // key. Hardcoded here because this script runs before any
      // module imports — keep the maps in sync with THEMES/COUNTERPART
      // in src/lib/theme.ts.
      (function () {
        var LIGHT = { ivory: 1, daylight: 1, pearl: 1 };
        // Dark <-> light siblings; doubles as the valid-id set.
        var PAIR = { 'golden-hour': 'ivory', 'ivory': 'golden-hour', 'default': 'daylight',
                     'daylight': 'default', 'onyx': 'pearl', 'pearl': 'onyx' };
        // Page-background hex per theme, for the browser-chrome tint.
        var bg = { 'golden-hour': '#0a0a0a', 'default': '#0a0a0f', 'onyx': '#000000',
                   'ivory': '#f2ede2', 'daylight': '#f4f5f7', 'pearl': '#f2f2f2' };
        var mode = 'dark', dark = 'golden-hour', light = 'ivory';
        try {
          var legacy = localStorage.getItem('maestro-theme');
          if (legacy && !PAIR[legacy]) legacy = null;
          var m = localStorage.getItem('maestro-theme-mode');
          mode = (m === 'dark' || m === 'light' || m === 'auto') ? m
               : (legacy && LIGHT[legacy]) ? 'light' : 'dark';
          var d = localStorage.getItem('maestro-theme-dark');
          dark = (d && PAIR[d] && !LIGHT[d]) ? d
               : legacy ? (LIGHT[legacy] ? PAIR[legacy] : legacy) : 'golden-hour';
          var l = localStorage.getItem('maestro-theme-light');
          light = (l && LIGHT[l]) ? l
                : legacy ? (LIGHT[legacy] ? legacy : PAIR[legacy]) : 'ivory';
        } catch (e) {
          // localStorage blocked (private mode etc) — fall through with
          // the hardcoded defaults so the user still gets the intended look.
        }
        var wantLight = mode === 'light' || (mode === 'auto' && window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: light)').matches);
        var t = wantLight ? light : dark;
        if (t && t !== 'default') {
          document.documentElement.setAttribute('data-theme', t);
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && bg[t]) meta.setAttribute('content', bg[t]);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
