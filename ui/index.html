<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/maestro-icon.png" />
    <link rel="apple-touch-icon" sizes="1254x1254" href="/maestro-home-icon-orange.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Keep the Home Screen header below an opaque status bar rather than
         under iOS's translucent shading. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Maestro" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Hint the UA before CSS loads so native controls don't flash the
         wrong scheme; the effective scheme comes from index.css
         (:root and theme-specific dark variants, light-variant data-theme ids light). theme-color tints
         mobile browser chrome and is synced per theme by the inline
         script below and by applyTheme() on switch. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#111316" />
    <title>Maestro</title>
  </head>
  <body spellcheck="true">
    <div id="root"></div>
    <script>
      // Apply theme BEFORE React mounts to avoid a flash of the wrong
      // theme on load. The first v4 load resets every install to Graphite
      // Studio dark; a fixed v4 marker preserves later choices across patch
      // updates. Afterward this resolves mode + family, including legacy
      // keys, like src/lib/theme.ts. Hardcoded because this runs before
      // module imports — keep the maps and migration marker in sync there.
      (function () {
        // Family -> its light-variant CSS id. Keys double as the
        // valid family-id set.
        var LIGHT_OF = { 'graphite-studio': 'graphite-daylight', 'golden-hour': 'ivory', 'default': 'daylight', 'onyx': 'pearl' };
        // Any theme id (either variant) -> its family.
        var FAMILY_OF = { 'graphite-studio': 'graphite-studio', 'graphite-daylight': 'graphite-studio',
                          'golden-hour': 'golden-hour', 'ivory': 'golden-hour',
                          'default': 'default', 'daylight': 'default',
                          'onyx': 'onyx', 'pearl': 'onyx' };
        // Page-background hex per theme, for the browser-chrome tint.
        var bg = { 'graphite-studio': '#111316', 'golden-hour': '#0a0a0a', 'default': '#0a0a0f', 'onyx': '#000000',
                   'graphite-daylight': '#d9dfe6',
                   'ivory': '#f2ede2', 'daylight': '#f4f5f7', 'pearl': '#f2f2f2' };
        var MIGRATION_KEY = 'maestro-theme-v4-migrated';
        var MIGRATION_VALUE = '4';
        var MODE_KEY = 'maestro-theme-mode';
        var FAMILY_KEY = 'maestro-theme-family';
        var LEGACY_KEY = 'maestro-theme';
        var INTERIM_DARK_KEY = 'maestro-theme-dark';
        var mode = 'dark', family = 'graphite-studio';
        try {
          var storage = localStorage;
          if (storage.getItem(MIGRATION_KEY) !== MIGRATION_VALUE) {
            // Write all supported theme keys before the marker. If storage is
            // blocked or partially writable, the page still paints the v4
            // default and runtime can retry without a false completion mark.
            storage.setItem(MODE_KEY, 'dark');
            storage.setItem(FAMILY_KEY, 'graphite-studio');
            storage.setItem(LEGACY_KEY, 'graphite-studio');
            storage.setItem(MIGRATION_KEY, MIGRATION_VALUE);
          } else {
            var legacy = storage.getItem(LEGACY_KEY);
            if (!Object.prototype.hasOwnProperty.call(FAMILY_OF, legacy)) legacy = null;
            var m = storage.getItem(MODE_KEY);
            var nextMode = (m === 'dark' || m === 'light' || m === 'auto') ? m
                         : (legacy && FAMILY_OF[legacy] !== legacy) ? 'light' : 'dark';
            var f = storage.getItem(FAMILY_KEY);
            var d = storage.getItem(INTERIM_DARK_KEY); // interim two-picker build
            var nextFamily = Object.prototype.hasOwnProperty.call(LIGHT_OF, f) ? f
                           : Object.prototype.hasOwnProperty.call(LIGHT_OF, d) ? d
                           : legacy ? FAMILY_OF[legacy] : 'graphite-studio';
            mode = nextMode;
            family = nextFamily;
          }
        } catch (e) {
          // Blocked/partial storage — keep the Graphite dark paint and leave
          // the marker absent unless every theme write completed successfully.
          mode = 'dark';
          family = 'graphite-studio';
        }
        var wantLight = mode === 'light' || (mode === 'auto' && window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: light)').matches);
        var t = wantLight ? LIGHT_OF[family] : family;
        if (t && t !== 'default') {
          document.documentElement.setAttribute('data-theme', t);
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && bg[t]) meta.setAttribute('content', bg[t]);
      })();
    </script>
    <script>
      // Boot watchdog: if React hasn't mounted within 10s, replace the
      // silent black screen with a diagnostic page. Inline scripts are
      // exempt from the strict ES-module MIME check, so this runs even
      // when the bundle itself was refused (e.g. Windows machines whose
      // registry serves .js as text/plain — a real community report:
      // assets returned 200 but never executed, and users saw nothing
      // but the theme background with no clue why).
      (function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) return; // app mounted
          document.body.innerHTML =
            '<div style="max-width:640px;margin:15vh auto 0;padding:0 24px;' +
            'font-family:system-ui,sans-serif;color:#e8e0d0;">' +
            '<h1 style="font-size:20px;margin-bottom:12px;">Maestro UI failed to load</h1>' +
            '<p style="line-height:1.6;font-size:14px;color:#b8b0a0;">The page was served but the app never started. In order, try:</p>' +
            '<ol style="line-height:1.9;font-size:14px;color:#b8b0a0;padding-left:20px;">' +
            '<li>Hard refresh: <b style="color:#e8e0d0">Ctrl+F5</b> (or Cmd+Shift+R)</li>' +
            '<li>Press <b style="color:#e8e0d0">F12</b> &rarr; Console tab, and share the first red error on Discord/GitHub</li>' +
            '<li>If the error mentions <b style="color:#e8e0d0">MIME type</b>: update Maestro (the fix shipped), or add an antivirus exclusion for the pinokio folder</li>' +
            '<li>Re-run <b style="color:#e8e0d0">Update</b> in Pinokio to rebuild the UI</li>' +
            '</ol></div>';
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
