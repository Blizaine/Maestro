name: CI

# Fast, dependency-light checks that must pass on every push + PR.
# The clean-repo guard is the important one for a public repo: it fails
# the build if mature/explicit prose or locally-generated model guides
# ever leak into tracked source (see scripts/verify_clean_repo.py).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  guard:
    name: Clean-repo guard + Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Clean-repo boundary guard
        run: python scripts/verify_clean_repo.py
      - name: Python syntax check (our modules)
        # compileall only compiles (never imports), so it needs no deps and
        # skips heavy vendored model code. Covers the surface we edit.
        run: python -m compileall -q app/services app/launch.py scripts
      - name: Install lightweight test dependencies
        run: >-
          python -m pip install
          "starlette==0.46.1"
          "numpy==2.2.6"
          "opencv-python-headless==4.12.0.88"
          "Pillow==11.3.0"
          "requests==2.32.4"
          "cryptography==49.0.0"
          "ffmpeg-python==0.2.0"
          "imageio==2.37.2"
          "av==16.1.0"
          "decord==0.6.0"
          "iopath==0.1.10"
          "onnxruntime==1.22.0"
          "pycocotools==2.0.11"
          "rembg==2.0.65"
          "scipy==1.15.3"
          "timm==1.0.24"
          "ftfy==6.3.1"
      - name: Install CPU PyTorch test dependency
        run: >-
          python -m pip install
          "torch==2.7.1"
          "torchvision==0.22.1"
          "torchaudio==2.7.1"
          --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned core model test dependencies
        run: >-
          python -m pip install
          "mmgp==3.7.12"
          "diffusers==0.36.0"
          "transformers==4.57.1"
          "tokenizers==0.22.1"
          "accelerate==1.12.0"
          "einops==0.8.2"
          "safetensors==0.8.0"
          "triton==3.3.1"
      - name: Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: JSON grammar regression tests
        # These are standalone test functions, so unittest discovery does not
        # execute them yet. Keep this explicit runner until they are migrated.
        run: python tests/test_call_llm_json_grammar.py

  ui-build:
    name: UI type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI deps
        working-directory: ui
        run: npm ci
      - name: Type-check + build (tsc -b && vite build)
        working-directory: ui
        run: npm run build
