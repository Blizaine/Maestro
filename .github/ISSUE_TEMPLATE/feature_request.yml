name: Feature request
description: Suggest a new capability, model, or workflow improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The goal or pain point — not just the solution you have in mind.
      placeholder: I want to… but currently I have to…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed idea
      description: How you imagine it working. Rough is fine.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried or considered
      description: Workarounds, similar features in other tools, related models/LoRAs.
    validations:
      required: false
